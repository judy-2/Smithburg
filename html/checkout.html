<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checkout</title>

    <link rel="stylesheet" href="/css/colors.css">
    <link rel="stylesheet" href="/css/checkout.css">
    
</head>
<body>
    <header style="background-color: #FFFF;">
        <h1>Smithburg</h1>
             
        <article class="back">
             <a href="/index.html"><button>o</button></a>
         </article>

         <article class="line">
            <p>.</p>
        </article>
    </header>

    <div class="shape">
    <h2>1. Delivery Method</h2>

    <button class="selection-btn" onclick="toggleButton(this)">
    <p>In-store pick up</p>
    </button>

    <button class="selection-btn" onclick="toggleButton(this)">
    <p>Delivery</p>
    </button>

    <h2>2. Payment Method</h2>

    <form>

      <div class="row">
          <div>
                <label for="fname">First Name:</label><br>
                <input type="text" id="fname" name="fname"> <br> <br>
          </div>

          <div>
                <label for="lname">Last Name:</label> <br>
               <input type="lname" id="lanme"> <br> <br>
          </div>
     </div>

     <div class="row">
        <div>
             <label for="number">Phone Number:</label> <br>
             <input type="number" id="number"> <br> <br>
        </div>

        <div>
            <label for="email">Email:</label> <br>
            <input type="email" id="email"> <br> <br>
       </div>
     </div>

     <div class="row">
        <div>
             <label for="cardh">Card Holder:</label> <br>
             <input type="cardh" id="cardh"> <br> <br>
        </div>
    </div>

    <div class="row">
        <div>
            <label for="cnumber">Card Number:</label> <br>
            <input type="cnumber" id="cnumber"> <br> <br>
       </div>
       
       <div>
            <label for="vuntil">Valid Until:</label> <br>
            <input type="vuntil" id="vunitl"> <br> <br>
        </div>

        <div>
            <label for="vcc">VCC:</label> <br>
            <input type="vcc" id="vcc"> <br> <br>
       </div>
    </div>

    </form>

    <article class="proceed">
        <a href="/html/success.html">Confirm Purchase</a>
    </article>

    </div>

    <script>
        function toggleButton(button) {
         button.classList.toggle("active")
     }
     </script>

</body>
