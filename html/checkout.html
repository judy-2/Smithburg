<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checkout</title>

    <link rel="stylesheet" href="/css/colors.css">
    <link rel="stylesheet" href="/css/checkout.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/typography.css">
    
</head>
<body>
    <header style="background-color: #FFFF;">
        <a href="/index.html">
            <h1>Smithburg</h1>
         </a>  
         
         <a><button class="back" onclick="history.back()">←</button></a>

         <article class="line">
            <p>.</p>
        </article>
    </header>

    <main>
    <h2>1. Delivery Method</h2>

    <button class="delivery-btn" onclick="toggleDelivery(this)">
    <p>In-store pick up</p>
    </button>

    <button class="delivery-btn" onclick="toggleDelivery(this)">
    <p>Delivery</p>
    </button>

    <h2>2. Payment Method</h2>

    <button class="selection-btn" onclick="toggleButton(this)">
        <img src="/assets/mastercard.png" alt="Image of Mastercard payment option"> 
    </button>
    
    <button class="selection-btn" onclick="toggleButton(this)">
        <img src="/assets/visa.png" alt="Image of Visa payment option"> 
    </button>

    <button class="selection-btn" onclick="toggleButton(this)">
        <img src="/assets/apple_pay.png" alt="Image of Apple Pay payment option"> 
    </button>

    <form>
      <div class="row">
          <div class="enter">
                <label for="fname">First Name:</label>
                <input type="text" id="fname" name="fname">
          </div>

          <div class="enter">
                <label for="lname">Last Name:</label> 
               <input type="lname" id="lname"> 
          </div>
     </div>

     <div class="row">
        <div class="enter">
             <label for="number">Phone Number:</label> 
             <input type="tel"  pattern="[0-9]{8,15}" required> 
        </div>

        <div class="enter">
            <label for="email">Email:</label> 
            <input type="email" id="email" required pattern=".+@+\.com"> 
       </div>
     </div>

     <div class="row">
        <div class="enter">
             <label for="cardh">Card Holder:</label> <br>
             <input type="cardh" id="cardh"> 
        </div>
    </div>

    <div class="row">
        <div class="enter">
            <label for="cnumber">Card Number:</label> 
            <input type="cnumber" id="cnumber"> 
       </div>
       
       <div class="enter">
            <label for="vuntil">Valid Until:</label> 
            <input type="vuntil" id="vunitl"> 
        </div>

        <div class="enter">
            <label for="vcc">VCC:</label> 
            <input type="vcc" id="vcc"> 
       </div>
    </div>
    </form>

    <article class="proceed">
        <a href="/html/success.html">Confirm Purchase</a>
    </article>

    </main>

    <script src="/js/checkout.js" ></script>
    
</body>
</html>
