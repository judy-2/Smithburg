<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      .cart-icon{
        position: absolute;
        top: -8px;
        right: -10px;

        background-color: red;
        color: white;
        border-radius: 50%;

        width: 18px;
        height: 18px;
        font-size: 12px;

        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
</head>
<body>
   <a href="/html/cart.html" class="cart-icon">
    s
    <span id="cart-count">0</span>
   </a>

   <button onclick="addToCart()">burger</button>
   <button onclick="addToCart()">shake</button>

   <script>
    let cartCount = 0;

    function addToCart() {
      cartCount++;
      document.getElementById("cart-count").innerText = cartCount;
    }

    if(cartCount ===0){
      document.getElementById("cart-count").style.display = "none";
    } else {
      document.getElementById("cart-count").style.display = "flex";
    }
   </script>
</body>
</html>
